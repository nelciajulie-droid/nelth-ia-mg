                <!-- MODE INVITÉ (à la ChatGPT) — handshake AVANT le boot du SPA :
                     un visiteur sans session obtient directement un compte
                     anonyme jetable et atterrit dans le chat. La page /auth
                     reste INTACTE (aucun bouton invité dessus) ; la reconnexion
                     se fait via les boutons « Se connecter / S'inscrire »
                     injectés en haut à droite par guest-bridge.js.
                     Voir public/static/guest-bridge.js + /api/v1/auths/guest. -->
                <script>
                        (() => {
                                const AUTH_SURFACE = /^\/(auth|oauth|forgot)(\/|$)/;
                                const TIMEOUT_MS = 8000; // watchdog boot (30 s checkpoint) : cap confortable, froid serverless inclus
                                let ready;
                                try {
                                        const path = window.location.pathname;
                                        const hasToken = !!localStorage.getItem('token');
                                        const stashed = sessionStorage.getItem('nelth-guest-stash');

                                        if (AUTH_SURFACE.test(path) || hasToken) {
                                                // Page d'auth PURE (aucun invité auto ici) ou session
                                                // déjà présente (invité OU compte réel) → boot normal.
                                                ready = Promise.resolve();
                                        } else if (stashed) {
                                                // Retour depuis /auth SANS connexion : on restaure la
                                                // session invitée (et ses conversations) au lieu d'en
                                                // recréer une neuve.
                                                sessionStorage.removeItem('nelth-guest-stash');
                                                localStorage.setItem('token', stashed);
                                                ready = Promise.resolve();
                                        } else {
                                                // Nouveau visiteur → session invitée (compte anonyme
                                                // jetable côté serveur). Échec/réseau lent → boot
                                                // normal → page de connexion classique, jamais bloqué.
                                                let cancelled = false;
                                                const abort = new AbortController();
                                                const timeout = new Promise((resolve) => {
                                                        setTimeout(() => {
                                                                cancelled = true;
                                                                abort.abort();
                                                                resolve();
                                                        }, TIMEOUT_MS);
                                                });
                                                const signup = fetch('/api/v1/auths/guest', {
                                                        method: 'POST',
                                                        credentials: 'same-origin',
                                                        headers: { 'content-type': 'application/json' },
                                                        body: '{}',
                                                        signal: abort.signal,
                                                })
                                                        .then((r) => (r.ok ? r.json() : null))
                                                        .then((d) => {
                                                                if (!cancelled && d && d.token) {
                                                                        localStorage.setItem('token', d.token);
                                                                        return true;
                                                                }
                                                                return false;
                                                        })
                                                        .catch(() => false);
                                                ready = Promise.race([signup, timeout]);
                                        }
                                } catch (e) {
                                        ready = Promise.resolve();
                                }
                                // Le boot du SPA (script en bas de page) attend cette promesse.
                                window.__nelthGuestReady = ready;
                        })();
                </script>

                <script>
                        // On page load or when changing themes, best to add inline in `head` to avoid FOUC
                        (() => {
                                const metaThemeColorTag = document.querySelector('meta[name="theme-color"]');
                                const prefersDarkTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;

                                if (!localStorage?.theme) {
                                        localStorage.theme = 'system';
                                }

                                if (localStorage.theme === 'system') {
                                        document.documentElement.classList.add(prefersDarkTheme ? 'dark' : 'light');
                                        metaThemeColorTag.setAttribute('content', prefersDarkTheme ? '#212121' : '#ffffff');
                                } else if (localStorage.theme === 'oled-dark') {
                                        document.documentElement.style.setProperty('--color-gray-800', '#101010');
                                        document.documentElement.style.setProperty('--color-gray-850', '#050505');
                                        document.documentElement.style.setProperty('--color-gray-900', '#000000');
                                        document.documentElement.style.setProperty('--color-gray-950', '#000000');
                                        document.documentElement.classList.add('dark');
                                        metaThemeColorTag.setAttribute('content', '#000000');
                                } else if (localStorage.theme === 'light') {
                                        document.documentElement.classList.add('light');
                                        metaThemeColorTag.setAttribute('content', '#ffffff');
                                } else if (localStorage.theme === 'her') {
                                        document.documentElement.classList.add('her');
                                        metaThemeColorTag.setAttribute('content', '#983724');
                                } else {
                                        document.documentElement.classList.add('dark');
                                        metaThemeColorTag.setAttribute('content', '#212121');
                                }

                                // LICENSE covers these Nelth-AI splash logo assets.
                                // Do not alter, remove, obscure, or replace them except as LICENSE permits:
                                // https://docs.openwebui.com/license.
                                const preloadHref = document.documentElement.classList.contains('dark')
                                        ? '/static/splash-dark.png'
                                        : '/static/splash.png';
                                const preload = document.createElement('link');
                                preload.rel = 'preload';
                                preload.as = 'image';
                                preload.href = preloadHref;
                                preload.setAttribute('fetchpriority', 'high');
                                document.head.appendChild(preload);

                                window.matchMedia('(prefers-color-scheme: dark)').addListener((e) => {
                                        if (localStorage.theme === 'system') {
                                                if (e.matches) {
                                                        document.documentElement.classList.add('dark');
                                                        document.documentElement.classList.remove('light');
                                                        metaThemeColorTag.setAttribute('content', '#212121');
                                                } else {
                                                        document.documentElement.classList.add('light');
                                                        document.documentElement.classList.remove('dark');
                                                        metaThemeColorTag.setAttribute('content', '#ffffff');
                                                }
                                        }
                                });
                                const isDarkMode = document.documentElement.classList.contains('dark');

                                const logo = document.createElement('img');
                                logo.id = 'logo';
                                logo.style =
                                        'position: absolute; width: auto; height: 6rem; top: 44%; left: 50%; transform: translateX(-50%); display:block;';
                                logo.loading = 'eager';
                                logo.fetchPriority = 'high';
                                // LICENSE covers this Nelth-AI splash logo.
                                // Do not alter, remove, obscure, or replace it except as LICENSE permits:
                                // https://docs.openwebui.com/license.
                                logo.src = isDarkMode ? '/static/splash-dark.png' : '/static/splash.png';
                                logo.alt = '';

                                document.addEventListener('DOMContentLoaded', function () {
                                        const splash = document.getElementById('splash-screen');
                                        if (document.documentElement.classList.contains('her')) {
                                                return;
                                        }

                                        if (splash) splash.prepend(logo);
                                });
                        })();
                </script>
